[tool.poetry]
name = "fair_kcenter"
version = "0.1.0"
description = ""
authors = ["Daniel Schmidt <dschmidt@hhu.de>", "Anna Arutyunova <anna.arutyunova@hhu.de>"]
packages = [
    { include = "fair_kcenter" }
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.4"
pandas = "^2.0.3"
scikit-learn = "^1.3.2"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
black = {extras = ["jupyter"], version = "^24.4.2"}
pre-commit = "^2.14.0"
flake8 = "^3.9.2"
mypy = "^1.10.0"
matplotlib = "^3.8.0"

[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = true

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.isort]
profile = "black"
line_length = 88
