[tool.poetry]
name = "fair_kcenter"
version = "0.1.0"
description = "fair-k-center-via-outliers"
authors = [
    "Daniel Schmidt <dschmidt@hhu.de>",
    "Anna Arutyunova <anna.arutyunova@hhu.de>",
    "Michael Al Khatib <michael.al.khatib@hhu.de"
    ]
readme = "README.md"
license = "MIT"
packages = [
    { include = "fair_kcenter" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.poetry.urls]
Homepage = "https://clustering-toolkit.algo.hhu.de/K-Center_Clustering"
Repository = "https://github.com/algo-hhu/fair-k-center-via-outliers"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
gurobipy = "^13.0.3"
numpy = "^2.4.0"
scikit-learn = "^1.9.1"
pandas = "^3.1.0"
folktables = "0.0.12"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
black = {extras = ["jupyter"], version = "^26.10.1"}
pre-commit = "^4.7.0"
flake8 = "^7.5.0"
mypy = "^2.4.1"
matplotlib = "^3.11.2"

[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = true

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.isort]
profile = "black"
line_length = 88
