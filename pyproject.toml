[tool.poetry]
name = "fair_kcenter"
version = "0.1.0"
description = ""
authors = ["Daniel Schmidt <dschmidt@hhu.de>", "Anna Arutyunova <anna.arutyunova@hhu.de>"]
packages = [
    { include = "fair_kcenter" }
]

[tool.poetry.dependencies]
python = "^3.12"
gurobipy = "^13.0.3"
numpy = "^2.4.0"
scikit-learn = "^1.9.1"
pandas = "^3.1.0"
folktables = "0.0.12"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
black = {extras = ["jupyter"], version = "^26.10.1"}
pre-commit = "^4.7.0"
flake8 = "^7.5.0"
mypy = "^2.4.1"
matplotlib = "^3.11.2"

[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = true

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.isort]
profile = "black"
line_length = 88
